name: Bug report
description: Report a reproducible defect
labels: ["type:bug"]
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment and evidence
      description: Include environment, browser, relevant logs with secrets/personal data removed.
    validations:
      required: true
  - type: checkboxes
    id: sensitive
    attributes:
      label: Data safety check
      options:
        - label: I removed all credentials and personal/student data from this report.
          required: true
