# ILM-SETUP-006 — Web quality CI
# Runs on pull requests and pushes to main.
# Does NOT apply database migrations, use production secrets, or call live DBs.
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  web:
    name: Web quality checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Require scaffolded web app
        id: app
        shell: bash
        run: |
          if [[ ! -f package.json || ! -f package-lock.json ]]; then
            echo "::error::apps/web must contain package.json and package-lock.json"
            exit 1
          fi
          echo "Web app lockfile present; continuing quality checks."

      - name: Setup Node.js 24 LTS
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test -- --run

      - name: Production build
        run: npm run build
        env:
          # Public placeholders for Next.js build only — never production values.
          # Do not set SUPABASE_SECRET_KEY in CI; privileged paths are not exercised here.
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_placeholder_for_build_only
          NEXT_PUBLIC_APP_URL: http://localhost:3000
