name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  web:
    name: Web quality checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Detect whether the M0 web app has been scaffolded
        id: app
        shell: bash
        run: |
          if [[ -f package.json && -f package-lock.json ]]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Next.js app not scaffolded yet. Full web CI activates after M0 adds package.json and package-lock.json."
          fi
      - name: Setup Node.js 24 LTS
        if: steps.app.outputs.ready == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install dependencies
        if: steps.app.outputs.ready == 'true'
        run: npm ci
      - name: Lint
        if: steps.app.outputs.ready == 'true'
        run: npm run lint
      - name: Typecheck
        if: steps.app.outputs.ready == 'true'
        run: npm run typecheck
      - name: Unit tests
        if: steps.app.outputs.ready == 'true'
        run: npm run test -- --run
      - name: Build
        if: steps.app.outputs.ready == 'true'
        run: npm run build
        env:
          # Placeholder values are only for builds; never use production secrets in CI.
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_placeholder_for_build_only
          NEXT_PUBLIC_APP_URL: http://localhost:3000
